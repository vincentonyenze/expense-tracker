<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <h1>Expense Tracker</h1>
    <p>Track your income and spending in one place.</p>
  </header>

  <main class="container">
    <!-- Summary cards -->
    <section class="summary" aria-label="Summary">
      <article class="card card--balance">
        <h2>Balance</h2>
        <p id="balance" class="card__amount">$0.00</p>
      </article>
      <article class="card card--income">
        <h2>Income</h2>
        <p id="total-income" class="card__amount">$0.00</p>
      </article>
      <article class="card card--expense">
        <h2>Expenses</h2>
        <p id="total-expense" class="card__amount">$0.00</p>
      </article>
    </section>

    <!-- Transaction form -->
    <section class="panel">
      <h2 id="form-title">Add transaction</h2>

      <form id="transaction-form" novalidate>
        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" name="description" placeholder="e.g. Groceries">
        </div>

        <div class="form-group">
          <label for="amount">Amount</label>
          <input type="number" id="amount" name="amount" placeholder="0.00" step="0.01" min="0">
        </div>

        <div class="form-group">
          <label for="type">Type</label>
          <select id="type" name="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">Select a category</option>
            <option value="salary">Salary</option>
            <option value="freelance">Freelance</option>
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="housing">Housing</option>
            <option value="utilities">Utilities</option>
            <option value="entertainment">Entertainment</option>
            <option value="health">Health</option>
            <option value="shopping">Shopping</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" name="date">
        </div>

        <p id="form-error" class="form-error" role="alert"></p>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn">Add transaction</button>
          <button type="button" id="cancel-btn" class="btn btn--secondary" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <!-- Transaction history -->
    <section class="panel">
      <h2>History</h2>

      <div id="toolbar" class="toolbar">
        <div class="form-group">
          <label for="filter-type">Type</label>
          <select id="filter-type">
            <option value="all">All types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>

        <div class="form-group">
          <label for="filter-category">Category</label>
          <select id="filter-category">
            <option value="all">All categories</option>
          </select>
        </div>
      </div>

      <ul id="transaction-list" class="transaction-list"></ul>
      <p id="empty-state" class="empty-state">No transactions yet. Add your first one above.</p>
    </section>
  </main>
</body>
</html>
